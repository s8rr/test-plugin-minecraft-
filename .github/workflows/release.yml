name: Build & Release Plugin

# Triggers when you publish a new GitHub Release
on:
  release:
    types: [created]

# Required to upload files to the release
permissions:
  contents: write

jobs:
  build:
    name: Build JAR and attach to Release
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 21 (Paper 1.21.x requires Java 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven        # Cache Maven dependencies for faster builds

      # 3. Build the plugin jar
      - name: Build with Maven
        run: mvn clean package -DskipTests --no-transfer-progress

      # 4. Attach the built jar to the GitHub Release
      - name: Upload JAR to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/FlyPlugin-*.jar
